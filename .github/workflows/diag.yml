name: diag

# 临时诊断：查清海外 runner 访问各接口的真实返回。用完可删。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 出口 IP 与归属地
        run: |
          echo "=== ipip ==="
          curl -s --max-time 20 https://myip.ipip.net || echo "(fail)"
          echo
          echo "=== ipinfo ==="
          curl -s --max-time 20 https://ipinfo.io/json || echo "(fail)"
          echo
          echo "=== 到国内站点的连通性 ==="
          curl -s -o /dev/null -w 'baidu %{http_code} %{time_total}s\n' --max-time 20 https://www.baidu.com || true

      - name: 各域名状态码
        run: |
          for u in \
            https://cyy.nmgcyy.com.cn/ \
            https://cyy.nmgcyy.com.cn/fcpublic/ \
            https://ya.iyunxh.com/ \
            https://static2-ya.iyunxh.com/ \
            https://nmgrb.y-h5.iyunxh.com/
          do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$u" 2>/dev/null || echo ERR)
            echo "$u -> $code"
          done

      - name: 登录接口原始返回
        run: |
          echo "=== 空 body POST ==="
          curl -s -i --max-time 25 -X POST https://cyy.nmgcyy.com.cn/member/login/memberLogin \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: TMProject/4.7.0 (iPhone; iOS 17.0; Scale/3.00)' \
            -d '{}' | head -50
          echo
          echo "=== 正常 body POST（假号，只为看状态码） ==="
          curl -s -i --max-time 25 -X POST https://cyy.nmgcyy.com.cn/member/login/memberLogin \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: TMProject/4.7.0 (iPhone; iOS 17.0; Scale/3.00)' \
            -d '{"mobile":"13800138000","password":"x","state":"2"}' | head -30

      - name: 任务列表接口
        run: |
          curl -s -i --max-time 25 "https://ya.iyunxh.com/api/aosbasemodule/_task_list?activity_id=11106679&module_id=41603" \
            -H 'User-Agent: TMProject/4.7.0 (iPhone; iOS 17.0; Scale/3.00)' | head -30
